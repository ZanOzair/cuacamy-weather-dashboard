name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The app talks to third-party APIs with no backend in between, so an
    # upstream change would otherwise only surface as a silently broken page.
    - cron: '17 21 * * *'

permissions:
  contents: read

jobs:
  verify:
    name: Verify static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js
          node --check config.example.js
          node --check tools/static-checks.mjs
          node --check tools/set-domain.mjs

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Check every referenced local asset exists
        run: |
          status=0
          # Pull src/href values out of the HTML and manifest, keep local paths,
          # and confirm each one is actually in the repo.
          for f in $(grep -ohE '(src|href)="\./[^"]+"' index.html \
                     | sed -E 's/.*"\.\/([^"]+)".*/\1/' | sort -u) \
                   $(grep -ohE '"\./assets/[^"]+"' manifest.webmanifest \
                     | tr -d '"' | sed 's|^\./||' | sort -u); do
            if [ ! -e "$f" ]; then echo "missing asset: $f" >&2; status=1; fi
          done
          [ $status -eq 0 ] && echo "all referenced assets present"
          exit $status

      - name: Structural checks
        # Duplicate ids, unresolvable selectors, CSP gaps, innerHTML, unguarded
        # target="_blank", and version drift between app.js and sw.js.
        run: node tools/static-checks.mjs

      - name: External API contract tests
        run: node tools/api-contract.mjs --dump

      - name: Warn if an API key is committed
        run: |
          # A static site cannot hide a key, so committing one is a legitimate
          # deployment choice — but it must be a *restricted* key. This warns
          # rather than blocking.
          if grep -rInE '(appid|openWeatherKey)["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9]{20,}' \
               --include='*.js' --include='*.html' . ; then
            echo "::warning::An API key is committed. Restrict it to your domain in the OpenWeatherMap dashboard."
          else
            echo "No committed API keys found."
          fi

  e2e:
    name: End-to-end against live APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app itself has no dependencies; Playwright is a test-only tool and
      # is installed here rather than committed to the project.
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve the site and run the smoke test
        env:
          PORT: 8080
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html >/dev/null && break
            sleep 1
          done
          node tools/e2e.mjs
