name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Warn if an API key is committed
        run: |
          # A static site cannot hide a key, so committing one is a legitimate
          # deployment choice — but it must be a *restricted* key. This step
          # reminds you rather than blocking the deploy.
          if grep -rInE '(appid|openWeatherKey)["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9]{20,}' \
               --include='*.js' --include='*.html' . ; then
            echo "::warning::An API key is committed. Restrict it to your domain in the OpenWeatherMap dashboard."
          else
            echo "No committed API keys found."
          fi

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement:true lets this action turn Pages on via the API using the
      # workflow's own `pages: write` permission, so the repo needs no manual
      # Settings -> Pages step before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
