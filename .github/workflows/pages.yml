name: Deploy to GitHub Pages

# NOTE: this workflow cannot run until GitHub Pages is switched on for the
# repository — Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". A repository's GITHUB_TOKEN is not permitted to create a
# Pages site (the API answers "Resource not accessible by integration"), so
# actions/configure-pages with enablement:true cannot substitute for that
# one-time setting. Until it is set, this workflow is expected to fail; CI
# lives in ci.yml so the repository's build badge stays independent of it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
