name: Publish site

# Publishes the site by pushing it to the `gh-pages` branch, which is what
# this repository's Pages source is set to.
#
# Why not actions/deploy-pages? That path deploys through the `github-pages`
# environment, and when Pages is served from a branch the environment only
# permits that branch to deploy — a run from `main` is rejected with
# "Branch main is not allowed to deploy to github-pages due to environment
# protection rules". Pushing the branch directly needs no environment at all,
# so it works regardless of how Pages was switched on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and push the site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"

          # Copy only what a browser needs. Excluding .github matters: a
          # GITHUB_TOKEN is refused when a push would add or change files under
          # .github/workflows, which would break this job on every run.
          rsync -a --exclude='.git' --exclude='.github' --exclude='docs' ./ "$site/"
          touch "$site/.nojekyll"

          # Custom domain.
          #
          # This job force-pushes gh-pages from a fresh git init, which means
          # anything on that branch that is not in this directory is destroyed.
          # GitHub writes a CNAME file to gh-pages when you set a custom domain
          # in Settings -> Pages, so without care the very next deploy would
          # delete it and drop the site back to github.io — with a broken
          # domain in between. Keeping CNAME in the repository instead makes it
          # part of every publish, and the check below catches the mismatch if
          # someone sets the domain only in Settings.
          if [ -f CNAME ]; then
            echo "Custom domain from repository CNAME: $(cat CNAME)"
          fi

          configured=$(curl -sS -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null \
            | python3 -c "import sys,json;print((json.load(sys.stdin).get('cname') or ''))" 2>/dev/null || echo "")

          if [ -n "$configured" ] && [ ! -f CNAME ]; then
            echo "::error::Pages is configured for the custom domain '${configured}', but there is no CNAME file in the repository. This publish would delete it and take the site offline. Create a file named CNAME containing '${configured}' and commit it."
            exit 1
          fi
          if [ -n "$configured" ] && [ "$(cat CNAME)" != "$configured" ]; then
            echo "::error::CNAME in the repository says '$(cat CNAME)' but Pages is configured for '${configured}'. They must match."
            exit 1
          fi

          # Stamp the build into the service worker. This is what makes an
          # update reach people: a browser only re-installs a worker whose
          # source bytes differ, so a deploy that changed app.js but left
          # sw.js identical would leave every returning visitor on the old
          # build with nothing in the UI to tell them. The commit SHA
          # guarantees the bytes differ on every single deploy.
          sed -i "s/^const BUILD_ID = 'dev';/const BUILD_ID = '${GITHUB_SHA:0:12}';/" "$site/sw.js"
          grep -q "const BUILD_ID = '${GITHUB_SHA:0:12}';" "$site/sw.js" \
            || { echo "::error::Failed to stamp BUILD_ID into sw.js"; exit 1; }
          echo "Stamped sw.js with build ${GITHUB_SHA:0:12}"

          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push --force --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published $(find . -type f -not -path './.git/*' | wc -l) files to gh-pages."

  verify-live:
    name: Verify the live site
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Needed so the step below can read CNAME and check the real domain.
      - uses: actions/checkout@v4

      - name: Wait for Pages to serve the new build, then check it
        run: |
          set -uo pipefail
          # Check the address people actually type. Once a custom domain is in
          # use, verifying github.io proves nothing about whether the real site
          # works — and github.io then only redirects, so a DNS or certificate
          # problem on the custom domain would go unnoticed.
          if [ -f CNAME ] && [ -s CNAME ]; then
            domain="$(tr -d '[:space:]' < CNAME)"
            url="https://${domain}/"
            echo "Custom domain in use: ${domain}"
          else
            owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
            url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          want="${GITHUB_SHA:0:12}"
          echo "Checking $url for build ${want}"

          # Wait for THIS build, not merely for the site to answer.
          #
          # The obvious loop — poll until the root returns 200 — passes instantly on
          # every deploy, because the previous build is already being served. Pages sits
          # behind a CDN, so for a minute or so after a push the old bytes are still
          # going out. That is exactly the stale-build condition this job exists to
          # catch, and the naive wait was blind to it: on the first run it "verified"
          # a copy of sw.js from the commit before.
          #
          # So the success condition is the deployed worker carrying this commit's
          # stamp. The real URL is polled, with no cache-buster, because a cache-buster
          # would test a URL no visitor ever requests.
          live_build=""
          for attempt in $(seq 1 40); do
            code=$(curl -sSL -H 'Cache-Control: no-cache' -o live-sw.js -w '%{http_code}' --max-time 20 "${url}sw.js" || echo 000)
            if [ "$code" = "200" ]; then
              live_build=$(sed -n "s/^const BUILD_ID = '\([^']*\)'.*$/\1/p" live-sw.js | head -1)
              if [ "$live_build" = "$want" ]; then
                echo "Build ${want} live after ${attempt} attempt(s)."
                break
              fi
            fi
            echo "  attempt ${attempt}: HTTP ${code}, serving build '${live_build:-none}' - waiting for ${want}..."
            live_build=""
            sleep 15
          done

          if [ "$live_build" != "$want" ]; then
            echo "::error::${url}sw.js never served build ${want}. The CDN may still be catching up, or the publish did not land."
            exit 1
          fi

          if grep -q "BUILD_ID = 'dev'" live-sw.js; then
            echo "::error::The live sw.js is unstamped - returning visitors would stay pinned to the cached build."
            exit 1
          fi

          # The shell must not just exist - its assets must load too.
          fail=0
          for asset in "" index.html app.js style.css manifest.webmanifest assets/icon-192.png; do
            a=$(curl -sSL -o page.out -w '%{http_code}' --max-time 20 "${url}${asset}" || echo 000)
            echo "  ${asset:-/}: HTTP ${a}"
            [ "$a" = "200" ] || fail=1
          done
          [ $fail -eq 0 ] || { echo "::error::One or more assets failed to load."; exit 1; }

          curl -sSL --max-time 20 "${url}index.html" -o live-index.html
          grep -q 'CuacaMY' live-index.html || { echo "::error::The served page is not CuacaMY."; exit 1; }

          # app.js and sw.js must not drift apart in version.
          curl -sSL -H 'Cache-Control: no-cache' --max-time 20 "${url}app.js" -o live-app.js
          app_v=$(sed -n "s/^const VERSION = '\([^']*\)'.*$/\1/p" live-app.js | head -1)
          sw_v=$(sed -n "s/^const VERSION  *= 'v\([^']*\)'.*$/\1/p" live-sw.js | head -1)
          echo "  app.js v${app_v} / sw.js v${sw_v} / build ${live_build}"
          if [ -z "$app_v" ] || [ "$app_v" != "$sw_v" ]; then
            echo "::error::Version drift: app.js says '${app_v}', sw.js says '${sw_v}'."
            exit 1
          fi

          echo "::notice::Live at ${url} serving v${app_v} build ${live_build}"
