name: Publish site

# Publishes the site by pushing it to the `gh-pages` branch, which is what
# this repository's Pages source is set to.
#
# Why not actions/deploy-pages? That path deploys through the `github-pages`
# environment, and when Pages is served from a branch the environment only
# permits that branch to deploy — a run from `main` is rejected with
# "Branch main is not allowed to deploy to github-pages due to environment
# protection rules". Pushing the branch directly needs no environment at all,
# so it works regardless of how Pages was switched on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and push the site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"

          # Copy only what a browser needs. Excluding .github matters: a
          # GITHUB_TOKEN is refused when a push would add or change files under
          # .github/workflows, which would break this job on every run.
          rsync -a --exclude='.git' --exclude='.github' --exclude='docs' ./ "$site/"
          touch "$site/.nojekyll"

          # Stamp the build into the service worker. This is what makes an
          # update reach people: a browser only re-installs a worker whose
          # source bytes differ, so a deploy that changed app.js but left
          # sw.js identical would leave every returning visitor on the old
          # build with nothing in the UI to tell them. The commit SHA
          # guarantees the bytes differ on every single deploy.
          sed -i "s/^const BUILD_ID = 'dev';/const BUILD_ID = '${GITHUB_SHA:0:12}';/" "$site/sw.js"
          grep -q "const BUILD_ID = '${GITHUB_SHA:0:12}';" "$site/sw.js" \
            || { echo "::error::Failed to stamp BUILD_ID into sw.js"; exit 1; }
          echo "Stamped sw.js with build ${GITHUB_SHA:0:12}"

          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push --force --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published $(find . -type f -not -path './.git/*' | wc -l) files to gh-pages."

  verify-live:
    name: Verify the live site
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages to serve the new build, then check it
        run: |
          set -uo pipefail
          owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Checking $url"

          code=000
          for attempt in $(seq 1 40); do
            code=$(curl -sSL -o page.html -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q 'CuacaMY' page.html; then
              echo "Live after ${attempt} attempt(s)."
              break
            fi
            echo "  attempt ${attempt}: HTTP ${code} — waiting…"
            sleep 15
          done

          if [ "$code" != "200" ]; then
            echo "::error::Site did not come up. Last status: HTTP ${code} at ${url}"
            exit 1
          fi

          # The shell must not just exist — its assets must load too.
          fail=0
          for asset in app.js style.css manifest.webmanifest assets/icon-192.png sw.js; do
            a=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "${url}${asset}" || echo 000)
            echo "  ${asset}: HTTP ${a}"
            [ "$a" = "200" ] || fail=1
          done
          [ $fail -eq 0 ] || { echo "::error::One or more assets failed to load."; exit 1; }

          # The stale-build trap this project hit once already: verify the
          # deployed worker really carries this commit's stamp, so a visitor's
          # browser is guaranteed to see new bytes and re-install.
          curl -sSL --max-time 20 "${url}sw.js" -o sw.js
          if grep -q "const BUILD_ID = 'dev';" sw.js; then
            echo "::error::The live sw.js is unstamped — returning visitors would be pinned to the cached build."
            exit 1
          fi
          echo "  live sw.js build: $(grep -o \"BUILD_ID = '[^']*'\" sw.js)"

          # The version in app.js and the one in sw.js must not drift apart.
          curl -sSL --max-time 20 "${url}app.js" -o app.js
          app_v=$(grep -o \"^const VERSION = '[^']*'\" app.js | head -1 | sed \"s/.*'\\(.*\\)'/\\1/\")
          sw_v=$(grep -o \"^const VERSION  = '[^']*'\" sw.js | head -1 | sed \"s/.*'v\\(.*\\)'/\\1/\")
          echo "  app.js v${app_v} · sw.js v${sw_v}"
          if [ "$app_v" != "$sw_v" ]; then
            echo "::error::Version drift: app.js says ${app_v}, sw.js says ${sw_v}."
            exit 1
          fi

          echo "::notice::Live and serving correctly at ${url}"
